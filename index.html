<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14181d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Robot Calc</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Robot Calc</h1>
    <nav id="tabs"></nav>
  </header>

  <main id="view"></main>

  <footer class="foot">build <span id="build"></span></footer>

  <template id="tpl-triangle">
    <section class="tri">
      <div class="calc-modes" role="group" aria-label="Triangle type"></div>

      <div class="calc-stage">
        <svg class="calc-diagram" aria-label="Triangle diagram"></svg>
      </div>

      <div class="calc-status" aria-live="polite"></div>
      <div class="calc-pick" hidden></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-extras-btn" aria-expanded="false">Area · P</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="calc-extras" hidden></div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <template id="tpl-vee">
    <section class="vee">
      <div class="calc-stage">
        <svg class="calc-diagram" aria-label="Part in a V nest"></svg>
      </div>
      <div class="vee-legend"></div>

      <div class="calc-status" aria-live="polite"></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-extras-btn" aria-expanded="false">More</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="calc-extras" hidden></div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <script src="js/version.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/triangle-math.js"></script>
  <script src="js/triangle-ui.js"></script>
  <script src="js/vee-math.js"></script>
  <script src="js/vee-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
