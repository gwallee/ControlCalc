<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14181d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control Calc">
  <title>Control Calc</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Control Calc</h1>
    <nav id="tabs"></nav>
  </header>

  <main id="view"></main>

  <footer class="foot">build <span id="build"></span></footer>

  <template id="tpl-triangle">
    <section class="tri">
      <div class="calc-modes" role="group" aria-label="Triangle type"></div>

      <div class="calc-stage">
        <svg class="calc-diagram" aria-label="Triangle diagram"></svg>
      </div>

      <div class="calc-status" aria-live="polite"></div>
      <div class="calc-pick" hidden></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-extras-btn" aria-expanded="false">Area · P</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="calc-extras" hidden></div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <template id="tpl-vee">
    <section class="vee">
      <div class="calc-modes" role="group" aria-label="Setup"></div>

      <div class="calc-stage">
        <svg class="calc-diagram" aria-label="Part in a V nest"></svg>
      </div>
      <div class="calc-legend"></div>

      <div class="calc-status" aria-live="polite"></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-extras-btn" aria-expanded="false">More</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="calc-extras" hidden></div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <template id="tpl-stack">
    <section class="stack">
      <div class="stack-opts"></div>
      <div class="stack-opts stack-opts2"></div>

      <div class="stack-row stack-dims"></div>

      <div class="stack-grid">
        <svg class="calc-diagram" aria-label="Placement grid"></svg>
        <div class="stack-note"></div>
      </div>

      <div class="stack-row stack-pos"></div>

      <div class="calc-status" aria-live="polite"></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn stack-xyz-btn" aria-expanded="false">XYZ</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="stack-xyz" hidden>
        <div class="stack-row stack-pitch"></div>
        <div class="stack-row stack-off"></div>
      </div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <template id="tpl-line">
    <section class="line">
      <div class="calc-stage">
        <svg class="calc-diagram" aria-label="Line between two points"></svg>
      </div>
      <div class="calc-legend"></div>

      <div class="calc-status" aria-live="polite"></div>
      <div class="calc-pick" hidden></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-extras-btn" aria-expanded="false">More</button>
        <button type="button" class="btn line-pts-btn" aria-expanded="false">Points</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="calc-extras" hidden></div>

      <div class="line-pts" hidden>
        <div class="line-pts-top">
          <div class="line-pts-n"></div>
          <div class="line-pts-step"></div>
        </div>
        <div class="line-pts-table"></div>
      </div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <template id="tpl-screw">
    <section class="screw">
      <div class="calc-stage">
        <svg class="calc-diagram" aria-label="Motor, gears and ball screw"></svg>
      </div>
      <div class="calc-legend"></div>

      <div class="calc-status" aria-live="polite"></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-extras-btn" aria-expanded="false">Units</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <div class="calc-extras" hidden></div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <template id="tpl-scale">
    <section class="scale">
      <div class="scale-row scale-in"></div>
      <div class="scale-row scale-out"></div>

      <div class="stack-grid scale-graph">
        <svg class="calc-diagram" aria-label="Scaling line"></svg>
      </div>

      <div class="stack-row scale-val"></div>

      <div class="calc-status" aria-live="polite"></div>

      <div class="calc-actions">
        <button type="button" class="btn calc-work-btn">ƒx Work</button>
        <button type="button" class="btn calc-clear">Clear</button>
      </div>

      <h2 class="work-head">Work</h2>
      <div class="calc-work"></div>
    </section>
  </template>

  <script src="js/version.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui-kit.js"></script>
  <script src="js/triangle-math.js"></script>
  <script src="js/triangle-ui.js"></script>
  <script src="js/vee-math.js"></script>
  <script src="js/vee-ui.js"></script>
  <script src="js/stack-math.js"></script>
  <script src="js/stack-ui.js"></script>
  <script src="js/line-math.js"></script>
  <script src="js/line-ui.js"></script>
  <script src="js/screw-math.js"></script>
  <script src="js/screw-ui.js"></script>
  <script src="js/scale-math.js"></script>
  <script src="js/scale-ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
